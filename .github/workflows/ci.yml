name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Nuxt types
        run: pnpm --filter @office-engine/web exec nuxt prepare

      - name: Lint custom UI controls
        run: pnpm lint:ui

      - name: Typecheck web
        run: pnpm --filter @office-engine/web exec tsc --noEmit

      - name: Typecheck legacy sync
        run: pnpm --filter @office-engine/sync exec tsc --noEmit -p tsconfig.json
