[package]
name = "office-engine-core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust Wasm engine for canvas document editing"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
loro = { version = "1.4", default-features = false }
taffy = "0.5"

[dev-dependencies]
wasm-bindgen-test = "0.3"
